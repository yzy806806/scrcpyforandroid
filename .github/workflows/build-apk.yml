name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_STORE_FILE: /tmp/release.keystore
      RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # sdkmanager 与 NDK 安装路径都依赖它 (GitHub runner 的预装路径)
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Fork guard (verify QUIC tunnel code intact)
        shell: bash
        run: bash .github/workflows/fork-guard.sh

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # runner 预装 Android SDK; android-actions/setup-android@v3 已失效
      # (尝试安装已被 Google 移除的 'tools' 包, sdkmanager 退出码 1)
      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          fi
          echo "SDK root: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

      # NDK 版本由 libcxx 派生 (app/build.gradle.kts 里 ndkVersion = libs.versions.libcxx),
      # runner 预装的 NDK 未必是这个版本, 必须显式安装
      - name: Read NDK version
        id: ndk
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^libcxx[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' gradle/libs.versions.toml)"
          if [[ -z "$version" ]]; then
            echo "libcxx version not found in gradle/libs.versions.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "NDK version: $version"

      - name: Cache Android NDK
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ steps.ndk.outputs.version }}
          key: ndk-${{ runner.os }}-${{ steps.ndk.outputs.version }}

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort | tail -n1)"
          if [[ -z "$sdkmanager" ]]; then
            echo "sdkmanager not found under $ANDROID_SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          yes | "$sdkmanager" --install "ndk;${{ steps.ndk.outputs.version }}"
          ls -d "$ANDROID_SDK_ROOT/ndk/${{ steps.ndk.outputs.version }}"

      - name: Decode signing keystore
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RELEASE_STORE_FILE"

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: scrcpyforandroid-ssh-release
          path: app/build/outputs/apk/release/*.apk
