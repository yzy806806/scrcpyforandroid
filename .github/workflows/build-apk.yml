name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_STORE_FILE: /tmp/release.keystore
      RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Fork guard (verify QUIC tunnel code intact)
        shell: bash
        run: bash .github/workflows/fork-guard.sh

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # runner 预装 Android SDK; android-actions/setup-android@v3 已失效
      # (尝试安装已被 Google 移除的 'tools' 包, sdkmanager 退出码 1)
      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          fi
          echo "SDK root: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

      - name: Decode signing keystore
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RELEASE_STORE_FILE"

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: scrcpyforandroid-ssh-release
          path: app/build/outputs/apk/release/*.apk
